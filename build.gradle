/ Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// ✅ Expo i React Native root plugins
apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// ✅ Ustawienia dla wszystkich subprojektów (bez afterEvaluate)
subprojects { project ->
  if (project.hasProperty("android")) {
    if (!project.android.hasProperty("compileSdkVersion")) {
      project.android.compileSdkVersion 35
    }

    if (project.android.defaultConfig != null) {
      if (!project.android.defaultConfig.hasProperty("targetSdkVersion")) {
        project.android.defaultConfig.targetSdkVersion 35
      }
      if (!project.android.defaultConfig.hasProperty("minSdkVersion")) {
        project.android.defaultConfig.minSdkVersion 24
      }
    }
  }

  // ✅ Specjalny patch dla react-native-google-mobile-ads
  if (project.name == "react-native-google-mobile-ads") {
    if (project.hasProperty("android")) {
      project.android.compileSdkVersion 35
      project.android.defaultConfig.targetSdkVersion 35
      project.android.defaultConfig.minSdkVersion 24
    }
    if (!project.ext.has("googleMobileAdsJson")) {
      project.ext.googleMobileAdsJson = "{}"
    }
  }
}
