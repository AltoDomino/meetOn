buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle:8.0.2') // Upewnij się, że masz konkretną wersję
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    classpath('com.google.gms:google-services:4.3.15') // ✅ Dodane - plugin do Firebase
  }
}

// ✅ Poprawny sposób pobrania ścieżki react-native/package.json
def stdoutBuffer = new ByteArrayOutputStream()
exec {
  commandLine "node", "--print", "require.resolve('react-native/package.json')"
  standardOutput = stdoutBuffer
}
def reactNativePackageJson = stdoutBuffer.toString().trim()
def reactNativeAndroidDir = new File(reactNativePackageJson).getParentFile().getParentFile()

allprojects {
  repositories {
    maven {
      url(reactNativeAndroidDir)
    }
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
